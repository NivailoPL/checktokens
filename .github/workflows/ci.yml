name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python scripts/build_windows.py
      - run: uv run python scripts/smoke_windows.py dist/CheckTokens-windows/checktokens-cli.exe
      - name: Packaged CLI with outbound networking blocked
        shell: powershell
        run: |
          $binary = (Resolve-Path 'dist/CheckTokens-windows/checktokens-cli.exe').Path
          $rule = 'CheckTokens-CI-' + [guid]::NewGuid()
          New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $binary -Action Block | Out-Null
          try { uv run python scripts/smoke_windows.py $binary; if ($LASTEXITCODE -ne 0) { throw 'Offline smoke failed' } }
          finally { Remove-NetFirewallRule -DisplayName $rule }
      - uses: actions/upload-artifact@v4
        with:
          name: CheckTokens-windows-x64
          path: |
            dist/CheckTokens-windows-x64.zip
            dist/SHA256SUMS-windows
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python scripts/build_macos.py
      - run: uv run python scripts/smoke_bundle.py dist/CheckTokens.app/Contents/MacOS/checktokens
      - uses: actions/upload-artifact@v4
        with:
          name: CheckTokens-${{ matrix.os }}
          path: |
            dist/CheckTokens-macos-*.zip
            dist/SHA256SUMS
